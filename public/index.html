<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#708dff"><link rel="manifest" href="/manifest.webmanifest"><title>Calendar Assistant</title><link rel="stylesheet" href="/styles.css"></head><body><main class="app"><header><div><small>AI VOICE ASSISTANT</small><h1>Your calendar, spoken naturally.</h1></div><button id="connect">Connect Google Calendar</button></header><section class="status"><i id="dot"></i><span id="status">Checking connection…</span><button id="install" class="secondary hidden">Install app</button></section><section class="layout"><section><div id="chat" class="chat"><div class="bubble bot">Hi! Ask me to schedule one or many events, edit or delete events, add reminders, or show your calendar.</div></div><section class="composer"><textarea id="input" placeholder="Try: Book lunch tomorrow at 1 PM and a workout at 6 PM every weekday"></textarea><div><button id="voice" class="secondary">🎙️ Speak</button><button id="send">Send command</button></div><small>Ask follow-ups naturally when I need more information.</small></section></section><aside class="dashboard"><div class="dash-head"><h2>Next 30 days</h2><button id="refresh" class="secondary">↻</button></div><div id="events">Connect Google Calendar to see events.</div></aside></section></main><script src="/app.js"></script></body></html>
